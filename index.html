function officialFieldRows(section){return (section.fields||[]).slice(0,6).map(label=>`<div class="official-live-row"><span>${esc(label)}</span><strong>—</strong></div>`).join('')}

function paperHtml(kind,section){
  const pages=officialFormPages[kind],page=section.page,pageIndex=pages.indexOf(page)+1;
  return `<aside class="paper-wrap official-paper-wrap"><div class="official-page-counter"><span>หน้า ${pageIndex} / ${pages.length}</span></div><div class="official-page-stage"><img class="official-page-image" src="${officialPagePath(page)}" alt="แบบทางการ หน้า ${pageIndex}"><section class="official-live-panel"><header><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i><span>ข้อมูลที่กำลังกรอกในส่วนนี้</span></header><div class="official-live-list">${officialFieldRows(section)}</div></section></div><div class="official-page-switcher">${pages.map((p,i)=>`<button type="button" class="${p===page?'active':''}" data-official-page="${p}" title="หน้า ${i+1}">${i+1}</button>`).join('')}</div></aside>`;
}

function tabbedFormPage(kind,formLabel,title,sections,caseNo,afterHeaderHtml){
  if(formSection>=sections.length)formSection=0;
  const section=sections[formSection],isLast=formSection===sections.length-1;
  return `<div class="form-page"><header class="form-header"><div class="breadcrumb">ระบบหมายจับ <b>›</b> ${esc(caseNo||'คำร้องใหม่')} <b>›</b> ${esc(formLabel)}</div><div class="page-head"><div><h1>${esc(title)}</h1><p>เลขคำร้อง ${esc(caseNo||'-')}, ร่างเอกสาร, ผู้รับผิดชอบ ${esc(roleNames[currentRole])}</p></div><div class="actions"><button class="btn secondary" data-go="registry"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>ทะเบียนคำร้อง</button><button class="btn secondary" data-action="print"><i class="fa-solid fa-print" aria-hidden="true"></i>พิมพ์ / บันทึก PDF</button></div></div></header>${afterHeaderHtml||''}`
  +`<section class="case-context"><div><small>แฟ้มคำร้อง</small><strong>${esc(caseNo||'-')}</strong></div><div><small>ผู้ต้องหา</small><strong>${esc((demoCases.find(x=>x.no===caseNo)||{}).suspect||'-')}</strong></div><div><small>แบบฟอร์ม</small><strong>${esc(formLabel)}</strong></div><div><small>ขั้นตอนปัจจุบัน</small><strong>${esc(roleNames[currentRole])}</strong></div><div><small>ส่วนที่กำลังกรอก</small><strong>${formSection+1} / ${sections.length}</strong></div></section>`
  +`<nav class="form-tabs" aria-label="หัวข้อแบบ ${esc(formLabel)}">${sections.map((s,i)=>`<button class="${i===formSection?'active':''}" data-section="${i}">${i+1}. ${esc(s.title)}</button>`).join('')}</nav>`
  +`<div class="workspace"><section class="form-panel"><header class="section-head"><div><span>ส่วนที่ ${formSection+1}</span><h2>${esc(section.title)}</h2><p>กรอกข้อมูลให้ครบก่อนไปหัวข้อถัดไป</p></div><span class="badge warning"><i class="fa-solid fa-pen" aria-hidden="true"></i>กำลังกรอก</span></header><div class="form-grid">${section.body}</div></section>${paperHtml(kind,section)}</div>`
  +`<footer class="sticky-actions"><button class="btn secondary" data-action="form-back"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>ย้อนกลับ</button><div class="actions"><button class="btn secondary" data-action="save"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>บันทึกร่าง</button><button class="btn" data-action="form-next">${isLast?'<i class="fa-solid fa-paper-plane" aria-hidden="true"></i>ส่งขั้นตอนถัดไป':'<i class="fa-solid fa-arrow-right" aria-hidden="true"></i>บันทึกและถัดไป'}</button></div></footer></div>`;
}

function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}
function go(route){location.hash='#/'+route}
function base(title,description,actions=''){return `<div class="breadcrumb">กิจกรรมที่ 9 <b>›</b> ระบบหมายจับ</div><header class="page-head"><div><h1>${title}</h1><p>${description}</p></div><div class="actions">${actions}</div></header>`}
function placeholderNote(text){return `<div class="placeholder-note"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><div>${text}</div></div>`}
function stageTrack(current){
  return `<div class="card"><div class="stage-track">${stageOrder.map(([key,label],i)=>{const idx=stageOrder.findIndex(s=>s[0]===current);const cls=i<idx?'done':i===idx?'current':'';return `<span class="stage-step ${cls}">${i<idx?'<i class="fa-solid fa-check"></i>':''}${esc(label)}</span>`+(i<stageOrder.length-1?'<span class="stage-arrow"><i class="fa-solid fa-chevron-right"></i></span>':'')}).join('')}</div></div>`;
}

function caseRows(items){return items.map(c=>`<tr><td>${esc(c.no)}</td><td>${esc(c.suspect)}</td><td><span class="badge">${esc(c.status)}</span></td><td>${esc(c.owner)}</td><td>${esc(c.next)}</td><td><button class="btn secondary" data-go="case/${esc(c.no)}">เปิด →</button></td></tr>`).join('')}

function registry(){
  return base('ทะเบียนคำร้องขอออกหมายจับ','รายการคำร้องขอออกหมายจับทั้งหมดในระบบ (ข้อมูลตัวอย่าง)','<button class="btn" data-go="intake-activity5"><i class="fa-solid fa-folder-open" aria-hidden="true"></i>รับสำนวนจากกิจกรรมที่ 5</button>')
  +placeholderNote('หน้านี้เป็นโครงเทมเพลต — คอลัมน์/ตัวกรอง/การแบ่งหน้ายังไม่ทำ ใช้ demoCases ชุดตัวอย่างเพื่อแสดงสถานะครบทุกขั้นของ workflow รวมกรณีก่อนเปิดงาน (รอผลอัยการ)')
  +`<div class="stats"><div class="stat"><small>คำร้องทั้งหมด</small><strong>${demoCases.length}</strong></div><div class="stat"><small>รอผลอัยการ (ก่อนเปิดงาน)</small><strong>${demoCases.filter(c=>c.stage==='prosecutor_pending').length}</strong></div><div class="stat"><small>อยู่ระหว่างพิจารณาภายใน</small><strong>${demoCases.filter(c=>['draft','supervisor_review','director_review','secretary_review','court_pending'].includes(c.stage)).length}</strong></div><div class="stat"><small>ศาลออกหมายแล้ว</small><strong>${demoCases.filter(c=>c.stage==='issued').length}</strong></div></div>`
  +`<section class="card"><div class="card-head"><div><h2>รายการคำร้อง</h2><p>พบทั้งหมด ${demoCases.length} รายการ</p></div></div><div class="table-wrap"><table><thead><tr><th>เลขคำร้อง</th><th>ผู้ต้องหา</th><th>สถานะ</th><th>ผู้รับผิดชอบ</th><th>งานถัดไป</th><th>การดำเนินการ</th></tr></thead><tbody>${caseRows(demoCases)}</tbody></table></div></section>`;
}

const queues={
  'queue-officer':{role:'officer',label:'คิวเจ้าหน้าที่/เจ้าของสำนวน',stages:['prosecutor_pending','draft']},
  'queue-supervisor':{role:'supervisor',label:'คิวผู้บังคับบัญชาชั้นต้น',stages:['supervisor_review']},
  'queue-director':{role:'director',label:'คิว ผอ.สำนัก/กอง',stages:['director_review']},
  'queue-secretary':{role:'secretary',label:'คิวเลขานุการ',stages:['secretary_review','court_pending']}
};
function queuePage(routeKey){
  const meta=queues[routeKey];
  const items=demoCases.filter(c=>meta.stages.includes(c.stage));
  return base(meta.label,'รายการคำร้องที่รอดำเนินการในขั้นตอนนี้ (ข้อมูลตัวอย่าง)')
  +placeholderNote('คิวตรวจสอบตามบทบาท — ยังไม่มีปุ่มอนุมัติ/ส่งกลับจริง เป็นโครงหน้าเทมเพลต')
  +`<section class="card"><div class="card-head"><div><h2>${esc(meta.label)}</h2><p>พบ ${items.length} รายการ</p></div></div><div class="table-wrap"><table><thead><tr><th>เลขคำร้อง</th><th>ผู้ต้องหา</th><th>สถานะ</th><th>งานถัดไป</th><th>การดำเนินการ</th></tr></thead><tbody>${items.length?items.map(c=>`<tr><td>${esc(c.no)}</td><td>${esc(c.suspect)}</td><td><span class="badge">${esc(c.status)}</span></td><td>${esc(c.next)}</td><td><button class="btn secondary" data-go="case/${esc(c.no)}">เปิด →</button></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty"><i class="fa-solid fa-inbox"></i><br>ไม่มีรายการในคิวนี้</div></td></tr>'}</tbody></table></div></section>`;
}

function casePage(no){
  const c=demoCases.find(x=>x.no===no)||demoCases[0];
  return base('คำร้อง '+esc(c.no),esc(c.suspect)+' · '+esc(c.status))
  +stageTrack(c.stage)
  +(c.stage==='prosecutor_pending'&&c.returnedBy?`<div class="return-banner"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><div><strong>อัยการขอข้อมูลเพิ่มเติม (ก่อนเปิดงานจริง)</strong><small>ส่งกลับโดย: ${esc(c.returnedBy||'')}</small><small>${esc(c.returnNote||'')}</small></div></div>`:'')
  +placeholderNote('หน้ารายละเอียดคำร้อง — ยังไม่มี signature-party flow เต็มรูปแบบ หรือปุ่มอนุมัติ/ส่งกลับจริง (เทียบเคียงหน้า Case ของกิจกรรมที่ 6)')
  +`<section class="card"><div class="card-head"><div><h2>ข้อมูลคำร้องเบื้องต้น</h2></div></div><div style="padding:16px 20px" class="review-summary">
    <div><span>เลขคำร้อง</span><strong>${esc(c.no)}</strong></div>
    <div><span>สำนวนต้นทาง (กิจกรรมที่ 5)</span><strong>${esc(c.fromCaseNo||'-')}</strong></div>
    <div><span>ผู้ต้องหา</span><strong>${esc(c.suspect)}</strong></div>
    <div><span>สถานะปัจจุบัน</span><strong>${esc(c.status)}</strong></div>

function render(){
  const route=(location.hash.replace(/^#\//,'')||'registry');
  document.querySelectorAll('.nav button[data-route]').forEach(b=>b.classList.toggle('active',route===b.dataset.route||(route.startsWith('case/')&&b.dataset.route==='registry')));
  const view=document.getElementById('view');
  if(route==='registry')view.innerHTML=registry();
  else if(route==='intake-activity5')view.innerHTML=intakeActivity5Page();
  else if(route.startsWith('prosecutor-result/'))view.innerHTML=prosecutorResultPage(decodeURIComponent(route.substring('prosecutor-result/'.length)));
  else if(queues[route])view.innerHTML=queuePage(route);
  else if(route.startsWith('case/'))view.innerHTML=casePage(decodeURIComponent(route.substring('case/'.length)));
  else if(route.startsWith('form/'))view.innerHTML=formPage(decodeURIComponent(route.substring('form/'.length)));
  else if(route==='warrant-record')view.innerHTML=warrantRecordPage();
  else if(route==='tracking')view.innerHTML=trackingPage();
  else if(route==='reports')view.innerHTML=reportsPage();
  else view.innerHTML=registry();
  bind();
  window.scrollTo(0,0);
}

function bind(){
  document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route));
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('input[name="intake-mode"]').forEach(r=>r.addEventListener('change',()=>{
    document.querySelectorAll('.intake-mode-toggle label').forEach(l=>l.classList.toggle('checked',l.querySelector('input').checked));
    const formOn=document.querySelector('input[name="intake-mode"][value="form"]').checked;
    document.getElementById('intake-form-section').style.display=formOn?'':'none';
    document.getElementById('intake-upload-section').style.display=formOn?'none':'';
  }));
  document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{formSection=Number(b.dataset.section);render()});
  document.querySelectorAll('[data-action="form-next"]').forEach(b=>b.onclick=()=>{formSection++;render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-action="form-back"]').forEach(b=>b.onclick=()=>{if(formSection>0){formSection--;render()}else go('registry')});
  document.querySelectorAll('[data-action="save"]').forEach(b=>b.onclick=()=>toast('บันทึกร่างแล้ว (เทมเพลตนี้ยังไม่บันทึกจริง)'));
  document.querySelectorAll('[data-action="print"]').forEach(b=>b.onclick=()=>window.print());
  document.querySelectorAll('[data-official-page]').forEach(b=>b.onclick=()=>{const wrap=b.closest('.official-paper-wrap'),img=wrap?.querySelector('.official-page-image'),page=Number(b.dataset.officialPage);if(img)img.src=`./assets/forms/official/page-${String(page).padStart(2,'0')}.png`;wrap?.querySelectorAll('[data-official-page]').forEach(x=>x.classList.toggle('active',x===b))});
  document.querySelectorAll('[data-intake-activity5]').forEach(b=>b.onclick=()=>{
    const caseNo=b.dataset.intakeActivity5,a=activity5Cases.find(x=>x.caseNo===caseNo);
    if(!a)return;
    const no='AW-2569-'+String(100+demoCases.length).padStart(6,'0');
    demoCases.unshift({no,suspect:a.suspect,status:'รอผลพิจารณาจากพนักงานอัยการ',stage:'prosecutor_pending',owner:a.owner+' (เจ้าของสำนวน)',next:'รอผลพิจารณาจากพนักงานอัยการ แล้วบันทึกผลเข้าระบบ',intakeMode:'form',fromCaseNo:a.caseNo});
    toast('รับสำนวน '+caseNo+' เข้าโมดูลหมายจับแล้ว เลขคำร้อง '+no);
    go('case/'+no);
  });
  document.querySelectorAll('[data-save-prosecutor-result]').forEach(b=>b.onclick=()=>{
    const no=b.dataset.saveProsecutorResult,c=demoCases.find(x=>x.no===no);
    if(!c)return;
    const outcome=document.getElementById('prosecutor-outcome').value;
    const order={date:document.getElementById('prosecutor-date').value||'-',ref:document.getElementById('prosecutor-ref').value||'-',name:document.getElementById('prosecutor-name').value||'-',agency:document.getElementById('prosecutor-agency').value||'-',summary:document.getElementById('prosecutor-summary').value||'-'};
    if(outcome==='proceed'){
      c.stage='draft';c.status='เตรียมคำร้องขอหมายจับ';c.owner='เจ้าหน้าที่เจ้าของสำนวน';c.next='กรอก มจ.1 คำร้องขอออกหมายจับให้ครบก่อนส่งตรวจ';c.prosecutorOrder=order;delete c.returnedBy;delete c.returnNote;
      toast('บันทึกคำสั่งอัยการแล้ว — เปิดงานขอหมายจับในกิจกรรมที่ 9');
    }else if(outcome==='more_info'){
      c.stage='prosecutor_pending';c.status='อัยการขอข้อมูลเพิ่มเติมก่อนเปิดงาน';c.returnedBy=(order.name!=='-'?order.name+' ':'')+(order.agency!=='-'?order.agency:'พนักงานอัยการ');c.returnNote=order.summary;
      toast('บันทึกแล้ว — รอเจ้าของสำนวนจัดส่งข้อมูลเพิ่มเติมแล้วบันทึกผลอีกครั้ง');
    }else{
      c.stage='prosecutor_declined';c.status='อัยการยังไม่ให้ดำเนินการขอหมายจับ';c.next='ยุติการดำเนินการขอหมายจับชั่วคราว รอเหตุอันควรใหม่';delete c.returnedBy;delete c.returnNote;
      toast('บันทึกผลแล้ว — ยังไม่ให้ดำเนินการขอหมายจับ');
    }
    go('case/'+no);
  });
}

document.getElementById('role').addEventListener('change',e=>{currentRole=e.target.value;document.getElementById('side-role').textContent=roleNames[currentRole];toast('เปลี่ยนบทบาทเป็น '+roleNames[currentRole]);});
window.addEventListener('hashchange',()=>{formSection=0;render()});
render();
</script>
</body>
</html>
