function paperHtml(kind,section){
  const pages=officialFormPages[kind],page=section.page,pageIndex=pages.indexOf(page)+1;
  return `<aside class="paper-wrap official-paper-wrap" data-paper-kind="${kind}"><div class="official-page-counter"><span>หน้า ${pageIndex} / ${pages.length}</span></div><div class="official-page-stage"><img class="official-page-image" src="${officialPagePath(kind,page)}" alt="แบบทางการ หน้า ${pageIndex}"></div><div class="official-page-switcher">${pages.map((p,i)=>`<button type="button" class="${p===page?'active':''}" data-official-page="${p}" title="หน้า ${i+1}">${i+1}</button>`).join('')}</div></aside>`;
}

function formShell(formLabel,title,caseNo,modeBarHtml,bodyHtml){
  const c=demoCases.find(x=>x.no===caseNo)||{};
  const isCourtRevision=c.stage==='court_revision'||c.courtResult?.outcome==='more_info';
  const currentStep=isCourtRevision?'แก้ไขคำร้องตามรายการที่ศาลแจ้ง':(c.stage==='owner_review'?'เจ้าของสำนวนตรวจสอบและแก้ไขคำร้อง':'จัดทำร่างคำร้องขอหมายจับ');

function ownerReviewState(c){
  if(!c.ownerReview)c.ownerReview={checks:{},documents:{},note:'',completedAt:''};
  c.ownerReview.checks=c.ownerReview.checks||{};
  c.ownerReview.documents=c.ownerReview.documents||{};
  return c.ownerReview;
}

function ownerReviewDocuments(c){
  const po=c.prosecutorOrder||{},request=officerDocumentMeta(c);
  const docs=[{key:'request',kind:'request',name:request.file||'คำร้องขอให้ศาลออกหมายจับ',source:`${request.form||'ปปท.8-17'} · ${request.version||'ฉบับที่ผู้จัดทำส่งตรวจ'}`}];
  if(po.file||po.ref)docs.push({key:'prosecutor',kind:'preview',name:po.file||'หนังสือหรือคำสั่งจากพนักงานอัยการ',source:[po.ref,po.date].filter(Boolean).join(' · ')||'เอกสารอ้างอิงจากพนักงานอัยการ'});
  (c.attachments||[]).forEach((a,i)=>docs.push({key:'attachment-'+i,kind:'preview',name:a.name||`เอกสารประกอบลำดับที่ ${i+1}`,source:a.source||`เอกสารจากสำนวนต้นทาง${a.size?' · '+a.size:''}`}));
  return docs;
}

function ownerReviewCompletion(c){
  const state=ownerReviewState(c),checkKeys=['request_data','source_case','prosecutor_order','consistency'],docKeys=ownerReviewDocuments(c).map(d=>d.key);
  const total=checkKeys.length+docKeys.length;
  const done=checkKeys.filter(k=>state.checks[k]).length+docKeys.filter(k=>state.documents[k]).length;
  return {done,total,complete:total>0&&done===total};
}

function refreshOwnerReviewUi(c){
  const state=ownerReviewState(c),completion=ownerReviewCompletion(c);
  document.querySelectorAll('[data-owner-review-check]').forEach(input=>{
    const row=input.closest('.owner-review-check,.owner-unified-item'),checked=!!state.checks[input.dataset.ownerReviewCheck];
    input.checked=checked;row?.classList.toggle('reviewed',checked);
    const label=row?.querySelector('.owner-review-state');if(label)label.textContent=checked?'ตรวจแล้ว':'รอตรวจ';
  });
  document.querySelectorAll('[data-owner-doc-check]').forEach(input=>{
    const row=input.closest('.owner-document-row,.owner-unified-item'),checked=!!state.documents[input.dataset.ownerDocCheck];
    input.checked=checked;row?.classList.toggle('reviewed',checked);
    const label=row?.querySelector('[data-owner-doc-label]');if(label)label.textContent=checked?'ตรวจแล้ว':'รอตรวจ';
  });
  const count=document.querySelector('[data-owner-review-count]');if(count)count.textContent=`${completion.done} / ${completion.total} รายการ`;
  const meter=document.querySelector('[data-owner-review-meter]');if(meter)meter.style.width=(completion.total?Math.round(completion.done/completion.total*100):0)+'%';
  const guidance=document.querySelector('[data-owner-review-guidance]');
  if(guidance){guidance.classList.toggle('ready',completion.complete);guidance.innerHTML=completion.complete?'<i class="fa-solid fa-circle-check" aria-hidden="true"></i><span>ตรวจครบแล้ว พร้อมส่งให้ผู้บังคับบัญชา</span>':'<i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>ทำเครื่องหมายข้อมูลและเอกสารให้ครบก่อนส่ง</span>';}
  const submit=document.querySelector('[data-submit-review]');if(submit)submit.disabled=!completion.complete;
}

function captureFormState(){
  const route=location.hash.replace(/^#\//,'');
  const prefix=route.startsWith('officer-form/')?'officer-form/':route.startsWith('form/')?'form/':'';
  if(!prefix)return;
  const c=demoCases.find(x=>x.no===decodeURIComponent(route.substring(prefix.length)));
  if(!c)return;
  const controls=[...document.querySelectorAll('.form-panel input,.form-panel textarea,.form-panel select')];
  c.formData=c.formData||{};
  const dataKey=c.intakeMode==='upload'?'upload':formSection;
  c.formData[dataKey]=controls.map(el=>({type:el.type,value:el.value,checked:el.checked}));
}
function restoreFormState(route){
  const prefix=route.startsWith('officer-form/')?'officer-form/':route.startsWith('form/')?'form/':'';
  if(!prefix)return;
  const c=demoCases.find(x=>x.no===decodeURIComponent(route.substring(prefix.length)));
  const dataKey=c&&c.intakeMode==='upload'?'upload':formSection;
  const values=c&&c.formData&&c.formData[dataKey];
  if(!values)return;
  const controls=[...document.querySelectorAll('.form-panel input,.form-panel textarea,.form-panel select')];
  controls.forEach((el,i)=>{const saved=values[i];if(!saved||el.type==='file')return;if(['checkbox','radio'].includes(el.type))el.checked=saved.checked;else el.value=saved.value});
}

function caseOpenRoute(c){
  if(['activity5_new','activity5_source_revision'].includes(c.stage))return 'activity5-intake/'+c.no;
  if(c.stage==='draft')return c.started?'form/'+c.no:'intake-choice/'+c.no;
  if(c.stage==='owner_review')return 'officer-work/'+c.no;
  if(c.stage==='court_decision_review')return 'officer-court-followup/'+c.no;
  if(['termination_approval_pending'].includes(c.stage))return 'approval-work/'+c.no;
  if(['termination_notice_prepare','termination_notice_dispatch','termination_notice_tracking','termination_approval_revision','termination_rejected'].includes(c.stage))return 'termination-notice/'+c.no;
  if(['court_withdrawal_prepare','court_withdrawal_pending','court_withdrawal_revision','final_notification_prepare','withdrawn'].includes(c.stage))return 'bureau-work/'+c.no;
  if(c.stage==='central_registry_due')return 'central-registry/'+c.no;

function registrySearchMatches(c){
  const s=registrySearchState;
  const query=s.query.toLocaleLowerCase('th');
  const haystack=[c.no,c.fromCaseNo,c.suspect,c.idCard,c.owner,c.caseOwner,c.department,c.prosecutorOrder?.ref].filter(Boolean).join(' ').toLocaleLowerCase('th');
  const owner=[c.owner,c.caseOwner].filter(Boolean).join(' ').toLocaleLowerCase('th');
  const updated=updatedDateByCase[c.no]||'';
  return (!query||haystack.includes(query))
    &&(s.status==='all'||c.status===s.status)
    &&(s.department==='all'||c.department===s.department)
    &&(!s.owner||owner.includes(s.owner.toLocaleLowerCase('th')))
    &&(s.intakeMode==='all'||(s.intakeMode==='pending'&&!c.intakeMode)||c.intakeMode===s.intakeMode)
    &&(!s.dateFrom||updated>=s.dateFrom)
    &&(!s.dateTo||updated<=s.dateTo);
}

function officerWorkProgress(c){
  const steps=['รับงานจากทะเบียน','จัดทำคำร้อง ปปท.8-17','เจ้าของสำนวนตรวจสอบ','ผู้บังคับบัญชาตรวจสอบ','ผอ.สำนัก/กองอนุมัติ','เตรียมชุดยื่นศาล','ยื่นศาลและบันทึกเลขรับ','รอผล/แก้ไขตามศาล','ศาลออกหมาย','ตรวจสอบและบันทึกหมายจับ','กำหนดแนวทางดำเนินการ'];
  const stageIndex={draft:1,owner_review:2,supervisor_review:3,director_review:4,court_ready:5,court_pending:7,court_revision:7,court_hearing:7,court_transfer:7,court_decision:7,court_decision_review:7,court_closed:8,warrant_verification:9,warrant_correction:9,warrant_verified:9,execution_planning:10,got_pending:10,got_letter:10,got_dispatch:10,got_tracking:10,operation_tracking:10,issued:10};
  let current=stageIndex[c.stage]??0;
  if(c.stage==='court_ready'&&c.courtPackage?.prepared)current=6;
  const complete=Boolean(c.executionPlan?.confirmed&&c.executionPlan.mode!=='pending');
  const currentLabel=complete?'ครบ '+steps.length+' ขั้นตอน':'ขั้นตอน '+(current+1)+' / '+steps.length+' · '+steps[current];
  return `<section class="officer-progress"><div class="officer-progress-head"><strong>ความคืบหน้างานตั้งแต่รับเรื่องถึงศาลออกหมาย</strong><span>${currentLabel}</span></div><div class="officer-progress-scroll"><div class="officer-progress-track">${steps.map((label,i)=>{const done=complete||i<current,currentStep=!complete&&i===current;return `<div class="officer-progress-step ${done?'done':currentStep?'current':''}"><span class="officer-progress-dot">${done?'<i class="fa-solid fa-check" aria-hidden="true"></i>':i+1}</span><span>${label}</span></div>`}).join('')}</div></div></section>`;
}

function uploadRequestStructuredData(c){
  const sections=kb1Sections(c),po=(c&&c.prosecutorOrder)||{};
  const sourceDocuments=[...(c&&c.attachments||[]),...(po.file?[{name:po.file,type:'pdf',size:'หนังสือ/คำสั่งจากพนักงานอัยการ'}]:[])];
  const sectionHtml=sections.map((section,index)=>{
    const state=index===0?'ตรวจจากไฟล์และกรอกเพิ่ม':'เชื่อมข้อมูลบางส่วน';
    return `<details class="upload-data-section" ${index===0?'open':''}>
      <summary><span class="upload-data-index">${index+1}</span><span class="upload-data-title"><strong>${esc(section.title)}</strong><small>${section.fields.length} รายการ · ข้อมูลชุดเดียวกับแบบกรอกออนไลน์</small></span><span class="upload-data-state">${state}</span></summary>
      <div class="upload-data-section-body"><div class="form-grid">${section.body}</div></div>
    </details>`;
  }).join('');
  const documentRows=sourceDocuments.length?sourceDocuments.map(doc=>`<div class="upload-supporting-row"><input type="checkbox" checked aria-label="เลือก ${esc(doc.name)}"><i class="fa-solid ${attachmentIcon(doc.type)}" aria-hidden="true"></i><span><strong>${esc(doc.name)}</strong><small>เชื่อมจากกิจกรรมที่ 5${doc.size?' · '+esc(doc.size):''}</small></span><button class="btn secondary" type="button" data-preview-name="${esc(doc.name)}"><i class="fa-solid fa-eye" aria-hidden="true"></i>เปิดดู</button></div>`).join(''):`<div class="empty">ยังไม่มีเอกสารประกอบจากสำนวนต้นทาง</div>`;
  return `<section class="upload-structured-panel form-panel">
    <div class="upload-structured-head"><div><h2>ข้อมูลคำร้องในระบบ</h2><p>ใช้ข้อมูลโครงสร้างเดียวกับการกรอกแบบ ปปท.8-17 ออนไลน์ ระบบเติมข้อมูลจากกิจกรรมที่ 5 ให้แล้ว เจ้าหน้าที่ตรวจจากไฟล์และกรอกเฉพาะช่องที่ยังว่าง</p></div><span class="badge">6 หมวดข้อมูล + เอกสาร</span></div>
    <div class="upload-data-legend"><span class="linked"><i class="fa-solid fa-link" aria-hidden="true"></i>เชื่อมจากกิจกรรมที่ 5 ไม่ต้องกรอกซ้ำ</span><span><i class="fa-solid fa-file-circle-check" aria-hidden="true"></i>ตรวจให้ตรงกับไฟล์ที่อัปโหลด</span><span class="required"><i class="fa-solid fa-pen" aria-hidden="true"></i>ช่องว่างต้องกรอกเพิ่ม</span></div>
    <div class="upload-data-sections">${sectionHtml}
      <details class="upload-data-section">
        <summary><span class="upload-data-index">7</span><span class="upload-data-title"><strong>เอกสารประกอบคำร้อง</strong><small>${sourceDocuments.length} รายการจากกิจกรรมที่ 5 · เลือกเอกสารที่จะส่งพร้อมคำร้อง</small></span><span class="upload-data-state">ตรวจรายการเอกสาร</span></summary>
        <div class="upload-data-section-body"><div class="form-grid"><div class="field wide"><div class="upload-supporting-list">${documentRows}</div><div class="upload-extra-file"><label for="upload-request-supporting-files">อัปโหลดเอกสารเพิ่มเติมหรือฉบับแก้ไข</label><input id="upload-request-supporting-files" type="file" accept=".doc,.docx,.xls,.xlsx,.pdf" multiple><small>รองรับ Word, Excel และ PDF เอกสารเพิ่มเติมจะถูกเก็บภายใต้เลขงานเดียวกัน</small></div></div></div></div>
      </details>
    </div>
  </section>`;
}

    appendAudit(c,'บันทึกแผนการไต่สวน',c.caseOwner,c.courtFollowup.responsible,`นัดวันที่ ${appointmentDate}${c.courtFollowup.appointmentTime?' เวลา '+c.courtFollowup.appointmentTime:''}`);
    updatedAtByCase[c.no]='15 ส.ค. 2569 12:15';
    await successAlert('บันทึกนัดไต่สวนแล้ว','งานยังอยู่ในแท็บนัดไต่สวนจนกว่าจะบันทึกผลล่าสุดหลังดำเนินการตามนัด');render();
  });
  document.querySelectorAll('[data-restart-court-transfer]').forEach(b=>b.onclick=async()=>{
    const c=demoCases.find(x=>x.no===b.dataset.restartCourtTransfer);
    if(!c)return;
    const newCourt=document.getElementById('transfer-new-court')?.value.trim()||'';
    if(!newCourt){toast('กรุณาระบุศาลใหม่ที่ต้องยื่นคำร้อง');return}
    const note=document.getElementById('transfer-note')?.value.trim()||'';
    const confirmed=await confirmHandoff({title:'ยืนยันศาลใหม่และเตรียมชุดยื่นครั้งถัดไป',c,from:c.courtSubmission?.court||'ศาลเดิม',to:newCourt,documentLabel:c.requestDocument?.file||'คำร้อง ปปท.8-17',confirmText:'ยืนยันศาลใหม่',note});
    if(!confirmed)return;
    if(c.courtPackage)c.courtPackageHistory=[...(c.courtPackageHistory||[]),c.courtPackage];
    if(c.courtSubmission)c.courtSubmissionHistory=[...(c.courtSubmissionHistory||[]),c.courtSubmission];
    c.courtFollowup={newCourt,referenceNo:document.getElementById('transfer-reference')?.value.trim()||'',date:document.getElementById('transfer-date')?.value||'',note,file:document.getElementById('transfer-file')?.files?.[0]?.name||''};
    c.targetCourt=newCourt;delete c.courtPackage;delete c.courtSubmission;
    c.stage='court_ready';c.status='พร้อมจัดชุดยื่นต่อศาลใหม่';c.owner=c.caseOwner;c.next='ตรวจรายการเอกสารและสร้างชุดยื่นศาลครั้งถัดไป แล้วบันทึกเลขรับใหม่';
    c.requestDocument={...(c.requestDocument||{}),version:'ฉบับพร้อมยื่นศาลใหม่',status:'พร้อมสร้างชุดยื่นครั้งถัดไป',stateKey:'approved'};
    addDocumentVersion(c,c.caseOwner);appendAudit(c,'ยืนยันศาลใหม่สำหรับยื่นคำร้อง',c.courtSubmissionHistory?.at(-1)?.court||'ศาลเดิม',newCourt,note||c.courtResult?.summary||'');
    updatedAtByCase[c.no]='15 ส.ค. 2569 12:20';
    await successAlert('บันทึกศาลใหม่แล้ว','ข้อมูลการยื่นและเลขรับเดิมถูกเก็บไว้ ระบบพร้อมสร้างชุดยื่นศาลครั้งถัดไปภายใต้เลขงานเดิม');go('officer-court-package/'+c.no);
  });
  document.querySelectorAll('[data-submit-court-decision]').forEach(b=>b.onclick=async()=>{
    const c=demoCases.find(x=>x.no===b.dataset.submitCourtDecision);
    if(!c)return;
    const action=document.getElementById('court-decision-action')?.value||'',opinion=document.getElementById('court-decision-opinion')?.value.trim()||'';
    if(!action||!opinion){toast('กรุณาเลือกแนวทางและระบุเหตุผลประกอบ');return}
    const file=document.getElementById('court-decision-file')?.files?.[0];
    const confirmed=await confirmHandoff({title:'ส่งความเห็นให้ผู้บังคับบัญชาพิจารณา',c,from:c.caseOwner,to:'ผู้บังคับบัญชาชั้นต้น',documentLabel:file?.name||c.courtResult?.file||'ผลพิจารณาจากศาล',confirmText:'ส่งความเห็น',note:action==='refile'?'เสนอแก้ไขและยื่นคำร้องใหม่':'เสนอให้ยุติงาน'});
    if(!confirmed)return;
    c.courtDecision={action,opinion,file:file?.name||'',submittedAt:'15 ส.ค. 2569 12:25'};
    c.stage='court_decision_review';c.status='รอผู้บังคับบัญชาพิจารณาแนวทางหลังผลศาล';c.owner='ผู้บังคับบัญชาชั้นต้น';c.next='ผู้บังคับบัญชาพิจารณาให้แก้ไขและยื่นใหม่ หรือยุติงาน';
    appendAudit(c,'เสนอแนวทางหลังผลพิจารณาจากศาล',c.caseOwner,c.owner,opinion);updatedAtByCase[c.no]='15 ส.ค. 2569 12:25';
    await successAlert('ส่งให้ผู้บังคับบัญชาแล้ว','รายการยังตรวจสอบได้จากแท็บไม่อนุมัติ/ถอนคำร้อง และเข้าสู่คิวผู้บังคับบัญชาชั้นต้น');go('officer-work/'+c.no);
  });
  document.querySelectorAll('[data-court-decision-action]').forEach(b=>b.onclick=async()=>{
    const c=demoCases.find(x=>x.no===b.dataset.courtDecisionCase),action=b.dataset.courtDecisionAction;
    if(!c)return;
    const refile=action==='refile';
    const confirmed=await confirmHandoff({title:refile?'เห็นชอบให้แก้ไขและยื่นคำร้องใหม่':'เห็นชอบให้ยุติงานขอหมายจับ',c,from:'ผู้บังคับบัญชาชั้นต้น',to:c.caseOwner,confirmText:refile?'เห็นชอบให้ยื่นใหม่':'เห็นชอบให้ยุติงาน',note:c.courtDecision?.opinion||''});
    if(!confirmed)return;
    if(refile){
      if(c.courtPackage)c.courtPackageHistory=[...(c.courtPackageHistory||[]),c.courtPackage];
      if(c.courtSubmission)c.courtSubmissionHistory=[...(c.courtSubmissionHistory||[]),c.courtSubmission];
      delete c.courtPackage;delete c.courtSubmission;
      c.stage='owner_review';c.status='ผู้บังคับบัญชาเห็นชอบให้แก้ไขและยื่นคำร้องใหม่';c.owner=c.caseOwner;c.next='แก้ไขคำร้องหรือรวบรวมเอกสารตามแนวทางที่ได้รับอนุมัติ แล้วส่งตรวจตามสายงาน';c.returnedBy='ผู้บังคับบัญชาชั้นต้น';c.returnNote=c.courtDecision?.opinion||c.courtResult?.summary||'';
      c.requestDocument={...(c.requestDocument||{}),version:'ฉบับเตรียมยื่นใหม่',status:'อยู่ระหว่างแก้ไขตามผลศาล',stateKey:'owner_review'};addDocumentVersion(c,c.caseOwner);
    }else{
      c.stage='court_closed';c.status='ยุติงานขอศาลออกหมายจับ';c.owner=c.caseOwner;c.next='ปิดงานและเก็บผลพิจารณา เอกสารศาล และความเห็นไว้ตรวจสอบย้อนหลัง';
    }
    appendAudit(c,refile?'ผู้บังคับบัญชาเห็นชอบให้แก้ไขและยื่นใหม่':'ผู้บังคับบัญชาเห็นชอบให้ยุติงาน','ผู้บังคับบัญชาชั้นต้น',c.caseOwner,c.courtDecision?.opinion||'');updatedAtByCase[c.no]='15 ส.ค. 2569 12:30';
    await successAlert(refile?'ส่งกลับให้เจ้าของสำนวนแก้ไขแล้ว':'ยุติงานเรียบร้อย',refile?'งานกลับไปแท็บตรวจสอบ/แก้ไขคำร้อง โดยยังใช้เลขงานเดิม':'ระบบปิดงานและเก็บเอกสารทั้งหมดไว้ในทะเบียนเพื่อค้นย้อนหลัง');go(refile?'officer-form/'+c.no:'registry');
  });
  document.querySelectorAll('[data-official-page]').forEach(b=>b.onclick=()=>{const wrap=b.closest('.official-paper-wrap'),kind=wrap?.dataset.paperKind,page=Number(b.dataset.officialPage),img=wrap?.querySelector('.official-page-image');if(img&&kind)img.src=officialPagePath(kind,page);wrap?.querySelectorAll('[data-official-page]').forEach(x=>x.classList.toggle('active',x===b))});
  document.querySelectorAll('[data-save-prosecutor-result]').forEach(b=>b.onclick=()=>{
    const no=b.dataset.saveProsecutorResult,c=demoCases.find(x=>x.no===no);
    if(!c)return;
    const outcome=document.getElementById('prosecutor-outcome').value;
    const order={date:document.getElementById('prosecutor-date').value||'-',ref:document.getElementById('prosecutor-ref').value||'-',name:document.getElementById('prosecutor-name').value||'-',agency:document.getElementById('prosecutor-agency').value||'-',summary:document.getElementById('prosecutor-summary').value||'-'};
    if(outcome==='proceed'){
      c.caseOwner=c.caseOwner||c.owner.replace(' (เจ้าของสำนวน)','');c.stage='draft';c.status='เตรียมคำร้องขอหมายจับ';c.owner=currentOfficerName;c.started=false;c.next='จัดทำคำร้องตามแบบ ปปท.8-17 แล้วส่งให้เจ้าของสำนวนตรวจสอบ';c.prosecutorOrder=order;delete c.requestDocument;delete c.returnedBy;delete c.returnNote;
      appendAudit(c,'เปิดงานขอศาลออกหมายจับจากผลอัยการ',c.caseOwner,currentOfficerName,'เริ่มจัดทำร่างคำร้องในทะเบียนคำร้อง');
      toast('บันทึกคำสั่งอัยการแล้ว เปิดงานจัดทำคำร้องในทะเบียน');
    }else if(outcome==='more_info'){
      c.stage='prosecutor_pending';c.status='อัยการขอข้อมูลเพิ่มเติมก่อนเปิดงาน';c.returnedBy=(order.name!=='-'?order.name+' ':'')+(order.agency!=='-'?order.agency:'พนักงานอัยการ');c.returnNote=order.summary;
      toast('บันทึกแล้ว — รอเจ้าของสำนวนจัดส่งข้อมูลเพิ่มเติมแล้วบันทึกผลอีกครั้ง');
    }else{
      c.stage='prosecutor_declined';c.status='อัยการยังไม่ให้ดำเนินการขอหมายจับ';c.next='ยุติการดำเนินการขอหมายจับชั่วคราว รอเหตุอันควรใหม่';delete c.returnedBy;delete c.returnNote;
      toast('บันทึกผลแล้ว — ยังไม่ให้ดำเนินการขอหมายจับ');
    }
    go('case/'+no);
  });
}

document.getElementById('role').addEventListener('change',e=>{currentRole=e.target.value;document.getElementById('side-role').textContent=roleNames[currentRole];const destinations={officer:'queue-officer',got:'queue-got',supervisor:'queue-supervisor',director:'queue-director',approver:'queue-approver',bureau:'queue-bureau',manager:'reports'};toast('เปลี่ยนบทบาทเป็น '+roleNames[currentRole]);if(destinations[currentRole])go(destinations[currentRole]);});
window.addEventListener('hashchange',()=>{formSection=0;render()});
render();
startAutomaticPostalTracking();
</script>
